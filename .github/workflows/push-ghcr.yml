name: Push Image to GHCR
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
    outputs:
      image:
        description: Published image URI with digest.
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev|refs/heads/feat/*) ;;
            *) echo "::error::Select dev or a feat/ branch."; exit 1 ;;
          esac
          case "$COMPONENT" in backend|notification|frontend) ;; *) exit 1 ;; esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.component }}
          tags: type=raw,value=sha-${{ github.sha }}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/dev'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resolve published image
        if: github.ref == 'refs/heads/dev'
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${{ inputs.component }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
