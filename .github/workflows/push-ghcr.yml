name: Push image to GHCR
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
    outputs:
      image:
        description: Published image URI with digest.
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        id: build
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/dev|refs/heads/feat/*) ;;
            *) echo "::error::Select dev or a feat/ branch."; exit 1 ;;
          esac
          case "$COMPONENT" in backend|notification|frontend) ;; *) exit 1 ;; esac
          tag="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$COMPONENT:sha-$GITHUB_SHA"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$tag" .
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image and capture digest
        if: github.ref == 'refs/heads/dev'
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker push "$IMAGE_TAG" 2>&1 | tee "$RUNNER_TEMP/ghcr-push.log"; then
            if grep -Eqi 'denied|unauthorized|forbidden' "$RUNNER_TEMP/ghcr-push.log"; then
              echo "::error::GHCR rejected the push. Check organization package policy and grant this repository Write under the package's Manage Actions access settings."
            fi
            exit 1
          fi
          digest=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$RUNNER_TEMP/ghcr-push.log" | tail -n 1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${IMAGE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"
