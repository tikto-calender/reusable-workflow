name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the quality job.
        type: string
        required: false
        default: "22"
      working-directory:
        description: Directory containing package.json and package-lock.json.
        type: string
        required: false
        default: "."
      install-command:
        description: Command used to install dependencies.
        type: string
        required: false
        default: npm ci
      format-command:
        description: Formatting check command. Leave empty to skip.
        type: string
        required: false
        default: npm run format:check
      lint-command:
        description: Lint command. Leave empty to skip.
        type: string
        required: false
        default: npm run lint
      test-command:
        description: Test command. Leave empty to skip.
        type: string
        required: false
        default: npm test
      build-command:
        description: Build or syntax-check command. Leave empty to skip.
        type: string
        required: false
        default: ""
      coverage-artifact-name:
        description: Artifact name used to expose test coverage to a later job. Leave empty to skip upload.
        type: string
        required: false
        default: ""
      coverage-path:
        description: Coverage path relative to working-directory.
        type: string
        required: false
        default: coverage
      timeout-minutes:
        description: Maximum duration of the quality job.
        type: number
        required: false
        default: 20
permissions:
  contents: read

jobs:
  quality:
    name: Node quality checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Check formatting
        if: inputs.format-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.format-command }}

      - name: Lint
        if: inputs.lint-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

      - name: Run tests
        if: inputs.test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Upload coverage report
        if: inputs.coverage-artifact-name != '' && inputs.test-command != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: error
          retention-days: 1

      - name: Build or check production source
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

