name: Build or promote frontend and deploy S3
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.release && 'prod' || 'dev' }}
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET_NAME }}
      DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      APPLICATION_URL: ${{ vars.APPLICATION_URL }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE" == true ]]; then
            [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            commit=$(git rev-parse HEAD)
            git merge-base --is-ancestor "$commit" origin/dev
            git merge-base --is-ancestor "$commit" origin/main
            runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs" -f head_sha="$commit" -f branch=dev -f event=push -f status=success -f per_page=100)
            run=$(jq -er '[.workflow_runs[] | select(.head_sha == "'"$commit"'")][0].id' <<< "$runs")
            echo "sha=$commit" >> "$GITHUB_OUTPUT"
            echo "run=$run" >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = refs/heads/dev
          fi
      - name: Setup Node
        if: "!inputs.release"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        if: "!inputs.release"
        run: |
          npm ci
          npm run build
          node -e "require('fs').writeFileSync('dist/deployment.json', JSON.stringify({sha:process.env.GITHUB_SHA}))"
      - name: Scan frontend source
        if: "!inputs.release"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Archive build for promotion
        if: "!inputs.release"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          overwrite: true
          retention-days: 90
          if-no-files-found: error
      - name: Download the tested dev build
        if: inputs.release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-${{ github.sha }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify artifact SHA
        run: |
          jq -e --arg sha "$SOURCE_SHA" '.sha == $sha' dist/deployment.json
          : "${BUCKET:?Set FRONTEND_BUCKET_NAME}" "${DISTRIBUTION:?Set CLOUDFRONT_DISTRIBUTION_ID}" "${APPLICATION_URL:?Set APPLICATION_URL}"
          [[ "$APPLICATION_URL" == https://* ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - name: Upload assets then entry point
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Retain previous hashed files for open tabs and rollback.
          aws s3 sync dist/assets/ "s3://${BUCKET}/assets/" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://${BUCKET}" \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

          # Public files can keep stable names, so invalidate them as well as HTML.
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation: ${invalidation_id}" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: |
          set -euo pipefail
          : "${APPLICATION_URL:?Set APPLICATION_URL to the CloudFront HTTPS URL}"
          [[ "$APPLICATION_URL" == https://* ]]
          APPLICATION_URL="${APPLICATION_URL%/}"
          for attempt in {1..24}; do
            if curl -fsS --max-time 15 "$APPLICATION_URL/deployment.json" -o deployed.json && jq -e --arg sha "$SOURCE_SHA" '.sha == $sha' deployed.json >/dev/null && curl -fsS --max-time 15 "$APPLICATION_URL/" -o live.html && cmp -s live.html dist/index.html; then
              break
            fi
            if [[ "$attempt" == 24 ]]; then echo 'Deployment did not become visible'; exit 1; fi
            sleep 10
          done
          # Verify each built hashed file is available with the expected bytes.
          find dist/assets -type f -print0 | while IFS= read -r -d '' file; do
            curl -fsS --retry 3 --retry-all-errors --max-time 15 "$APPLICATION_URL/${file#dist/}" -o fetched-asset
            cmp "$file" fetched-asset
          done
          curl -fsS --retry 5 --retry-all-errors --max-time 15 "$APPLICATION_URL/api/health" | jq -e '.status == "ok"'
          echo "Deployed frontend $SOURCE_SHA to $APPLICATION_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Save smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-deploy-${{ github.run_attempt }}
          path: |-
            deployed.json
            live.html
          retention-days: 7
          if-no-files-found: ignore
