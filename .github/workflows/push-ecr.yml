name: Build and publish image
on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
    outputs:
      image:
        value: ${{ jobs.publish.outputs.image }}
        description: Immutable ECR digest URI
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      REPOSITORY: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - id: login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Check immutable image
        id: existing
        run: |
          set -euo pipefail
          aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids "imageTag=sha-$GITHUB_SHA" > existing.json
          jq -e 'all(.failures[]; .failureCode == "ImageNotFound")' existing.json
          if jq -e '.images | length == 1' existing.json >/dev/null; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.existing.outputs.found != 'true'
        run:
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "${{ steps.login.outputs.registry
          }}/$REPOSITORY:sha-$GITHUB_SHA" .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.login.outputs.registry }}/${{ inputs.repository }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        if: steps.existing.outputs.found != 'true'
        run: docker push "${{ steps.login.outputs.registry }}/$REPOSITORY:sha-$GITHUB_SHA"
      - name: Resolve digest
        id: image
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=sha-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${{ steps.login.outputs.registry }}/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
