name: Promote Dev digest to Prod
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      gitops-repository:
        required: true
        type: string
      digest:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repository }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
      - name: Open Prod promotion PR
        env:
          COMPONENT: ${{ inputs.component }}
          DIGEST: ${{ inputs.digest }}
          GITOPS_REPOSITORY: ${{ inputs.gitops-repository }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in backend|notification|frontend) ;; *) exit 1 ;; esac
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$COMPONENT@$DIGEST"
          git fetch origin dev
          dev_image=$(git show "FETCH_HEAD:apps/tikto/overlays/dev/$COMPONENT-image.yaml" | sed -nE 's/^[[:space:]]+image: (.+)$/\1/p')
          if [[ "$dev_image" != "$IMAGE" ]]; then
            echo "The requested digest is not the current Dev manifest image." >&2
            exit 1
          fi

          export PATCH="apps/tikto/overlays/prod/$COMPONENT-image.yaml"
          branch="promote/$COMPONENT/${DIGEST#sha256:}/$GITHUB_RUN_ID"
          if [[ -n "$(gh pr list --repo "$GITOPS_REPOSITORY" --head "$branch" --base main --json url --jq '.[0].url // empty')" ]]; then
            echo "An open PR already exists for this promotion."
            exit 0
          fi

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PATCH"])
          image = os.environ["IMAGE"]
          text, count = re.subn(r"(?m)^(\s+image: )\S+$", lambda match: match[1] + image, path.read_text())
          if count != 1:
              raise SystemExit("Expected exactly one image field")
          path.write_text(text)
          PY
          git add "$PATCH"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "prod: promote $COMPONENT $DIGEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            test "$(git show "FETCH_HEAD:$PATCH")" = "$(git show "HEAD:$PATCH")"
          else
            git push origin HEAD:"refs/heads/$branch"
          fi
          gh pr create --repo "$GITOPS_REPOSITORY" --head "$branch" --base main \
            --title "Promote $COMPONENT to Prod" --body "Promote the Dev image $IMAGE."
