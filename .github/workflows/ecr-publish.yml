name: ECR Publish

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region containing the ECR repository.
        type: string
        required: false
        default: ap-southeast-2
      aws-role-arn:
        description: IAM role assumed through GitHub OIDC.
        type: string
        required: true
      ecr-repository:
        description: ECR repository name, for example tikto/backend.
        type: string
        required: true
      service-name:
        description: Short service name used in the AWS role session.
        type: string
        required: true
      docker-context:
        description: Docker build context.
        type: string
        required: false
        default: "."
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        required: false
        default: Dockerfile
      image-tag:
        description: Explicit image tag. An immutable tag is generated when empty.
        type: string
        required: false
        default: ""
      trivy-severity:
        description: Comma-separated vulnerability severities that fail the job.
        type: string
        required: false
        default: HIGH,CRITICAL
      timeout-minutes:
        description: Maximum duration of the publish job.
        type: number
        required: false
        default: 35
    outputs:
      image:
        description: Fully qualified ECR image reference that was pushed.
        value: ${{ jobs.publish.outputs.image }}
      tag:
        description: Image tag that was pushed.
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      image: ${{ steps.push.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          set -euo pipefail
          for variable in AWS_ROLE_ARN ECR_REPOSITORY SERVICE_NAME; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::${variable} must not be empty."
              exit 1
            fi
          done

      - name: Create immutable image tag
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image-tag }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            safe_ref="${GITHUB_REF_NAME//\//-}"
            tag="${safe_ref}-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          fi

          if [[ ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag: ${tag}"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "local=${ECR_REPOSITORY}:${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build container image
        shell: bash
        run: >-
          docker build
          --file "${{ inputs.dockerfile }}"
          --tag "${{ steps.image.outputs.local }}"
          "${{ inputs.docker-context }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.local }}
          format: table
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          role-session-name: ${{ inputs.service-name }}-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push immutable image
        id: push
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
        run: |
          set -euo pipefail
          remote_image="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${remote_image}"
          docker push "${remote_image}"
          echo "image=${remote_image}" >> "${GITHUB_OUTPUT}"

      - name: Publish summary
        shell: bash
        run: echo "Published \`${{ steps.push.outputs.image }}\`" >> "${GITHUB_STEP_SUMMARY}"
