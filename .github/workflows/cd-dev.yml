name: Deploy Dev
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      gitops-repository:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/push-ghcr.yml
    permissions:
      contents: read
      packages: write
    with:
      component: ${{ inputs.component }}

  gitops:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-tools
          persist-credentials: false

      - name: Check out manifest
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repository }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: manifest

      - name: Record the Dev image and source commit
        working-directory: manifest
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE: ${{ needs.publish.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: python ../workflow-tools/scripts/gitops_release.py update-dev "$COMPONENT"
