name: Promote Backend (blue/green)
on:
  workflow_call:
    inputs:
      version:
        description: Backend release version, for example v2.0.1.
        type: string
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: promote-backend
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, tikto-prod-preview]
    timeout-minutes: 25
    environment: prod
    steps:
      - name: Check out manifest
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: manifest

      - name: Check out release scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-tools
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_RELEASE_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Stage, verify and switch the Backend
        working-directory: manifest
        env:
          VERSION: ${{ inputs.version }}
          DEV_URL: ${{ vars.BACKEND_DEV_URL }}
          APP_URL: ${{ vars.BACKEND_RELEASE_URL }}
          RULE_ARN: ${{ vars.BACKEND_RELEASE_RULE_ARN }}
          BLUE_ARN: ${{ vars.BACKEND_RELEASE_BLUE_ARN }}
          GREEN_ARN: ${{ vars.BACKEND_RELEASE_GREEN_ARN }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "4"
        run: python3 ../workflow-tools/scripts/backend_release.py
