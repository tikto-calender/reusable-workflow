name: S3 and CloudFront Deploy

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to build the frontend.
        type: string
        required: false
        default: "22"
      working-directory:
        description: Directory containing the frontend package.json.
        type: string
        required: false
        default: "."
      install-command:
        description: Command used to install frontend dependencies.
        type: string
        required: false
        default: npm ci
      build-command:
        description: Command used to build production frontend assets.
        type: string
        required: false
        default: npm run build
      build-directory:
        description: Build output directory relative to working-directory.
        type: string
        required: false
        default: dist
      entrypoint:
        description: HTML entrypoint relative to build-directory.
        type: string
        required: false
        default: index.html
      aws-region:
        description: AWS region used for S3 and CloudFront operations.
        type: string
        required: false
        default: ap-southeast-2
      aws-role-arn:
        description: IAM deployment role. Falls back to the environment variable AWS_DEPLOY_ROLE_ARN.
        type: string
        required: false
        default: ""
      bucket-name:
        description: Destination bucket. Falls back to the environment variable FRONTEND_BUCKET_NAME.
        type: string
        required: false
        default: ""
      cloudfront-distribution-id:
        description: Distribution ID. Falls back to the environment variable CLOUDFRONT_DISTRIBUTION_ID.
        type: string
        required: false
        default: ""
      environment-name:
        description: GitHub Environment name, for example dev or prod.
        type: string
        required: true
      trivy-severity:
        description: Comma-separated vulnerability severities that fail the job.
        type: string
        required: false
        default: HIGH,CRITICAL
      timeout-minutes:
        description: Maximum duration of the deployment job.
        type: number
        required: false
        default: 35
    outputs:
      invalidation-id:
        description: ID of the CloudFront invalidation.
        value: ${{ jobs.deploy.outputs.invalidation-id }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, scan and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment-name }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ inputs.aws-role-arn || vars.AWS_DEPLOY_ROLE_ARN }}
      FRONTEND_BUCKET_NAME: ${{ inputs.bucket-name || vars.FRONTEND_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront-distribution-id || vars.CLOUDFRONT_DISTRIBUTION_ID }}
    outputs:
      invalidation-id: ${{ steps.invalidation.outputs.id }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Build production assets
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: table
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Validate deployment inputs
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          BUCKET_NAME: ${{ env.FRONTEND_BUCKET_NAME }}
          DISTRIBUTION_ID: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
          BUILD_PATH: ${{ inputs.working-directory }}/${{ inputs.build-directory }}
          ENTRYPOINT: ${{ inputs.entrypoint }}
        run: |
          set -euo pipefail
          for variable in AWS_ROLE_ARN BUCKET_NAME DISTRIBUTION_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::${variable} must not be empty."
              exit 1
            fi
          done
          if [[ ! -d "${BUILD_PATH}" ]]; then
            echo "::error::Build directory not found: ${BUILD_PATH}"
            exit 1
          fi
          if [[ ! -f "${BUILD_PATH}/${ENTRYPOINT}" ]]; then
            echo "::error::Entrypoint not found: ${BUILD_PATH}/${ENTRYPOINT}"
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: frontend-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Upload hashed assets to S3
        shell: bash
        env:
          BUILD_PATH: ${{ inputs.working-directory }}/${{ inputs.build-directory }}
          BUCKET_NAME: ${{ env.FRONTEND_BUCKET_NAME }}
          ENTRYPOINT: ${{ inputs.entrypoint }}
        run: |
          set -euo pipefail
          aws s3 sync "${BUILD_PATH}/" "s3://${BUCKET_NAME}" \
            --delete \
            --exclude "${ENTRYPOINT}" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload application entrypoint to S3
        shell: bash
        env:
          BUILD_PATH: ${{ inputs.working-directory }}/${{ inputs.build-directory }}
          BUCKET_NAME: ${{ env.FRONTEND_BUCKET_NAME }}
          ENTRYPOINT: ${{ inputs.entrypoint }}
        run: |
          set -euo pipefail
          aws s3 cp "${BUILD_PATH}/${ENTRYPOINT}" \
            "s3://${BUCKET_NAME}/${ENTRYPOINT}" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        id: invalidation
        shell: bash
        env:
          DISTRIBUTION_ID: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          echo "id=${invalidation_id}" >> "${GITHUB_OUTPUT}"

      - name: Publish summary
        shell: bash
        run: |
          echo "Deployed to \`s3://${{ env.FRONTEND_BUCKET_NAME }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "CloudFront invalidation: \`${{ steps.invalidation.outputs.id }}\`" >> "${GITHUB_STEP_SUMMARY}"
