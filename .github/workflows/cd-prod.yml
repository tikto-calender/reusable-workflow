name: Promote Production
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Require the manifest main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from the manifest main branch."
            exit 1
          fi

      - name: Check out release scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-tools
          persist-credentials: false

      - name: Check out manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: manifest

      - name: Promote the current Dev image
        working-directory: manifest
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: python ../workflow-tools/scripts/gitops_release.py promote "$COMPONENT" "$VERSION"
