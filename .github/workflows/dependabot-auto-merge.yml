name: Reusable Dependabot Auto-merge

on:
  workflow_call:
    inputs:
      target-branch:
        description: The only base branch allowed to receive automatic merges.
        type: string
        required: false
        default: dev
      allow-patch:
        description: Allow semantic-version patch updates.
        type: boolean
        required: false
        default: true
      allow-minor:
        description: Allow semantic-version minor updates.
        type: boolean
        required: false
        default: true
      allow-major:
        description: Allow semantic-version major updates. Keep disabled unless explicitly accepted.
        type: boolean
        required: false
        default: false
      auto-approve:
        description: Approve eligible Dependabot pull requests before enabling auto-merge.
        type: boolean
        required: false
        default: true
      merge-method:
        description: Merge method. Supported values are squash, merge, and rebase.
        type: string
        required: false
        default: squash
    outputs:
      eligible:
        description: Whether the pull request passed the configured update policy.
        value: ${{ jobs.dependabot.outputs.eligible }}

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Evaluate Dependabot update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.base_ref == inputs.target-branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}

    steps:
      - name: Fetch verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate update policy
        id: policy
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          ALLOW_PATCH: ${{ inputs.allow-patch }}
          ALLOW_MINOR: ${{ inputs.allow-minor }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -euo pipefail

          case "${MERGE_METHOD}" in
            squash|merge|rebase) ;;
            *)
              echo "::error::Unsupported merge-method: ${MERGE_METHOD}"
              exit 1
              ;;
          esac

          eligible=false
          if [[ "${MAINTAINER_CHANGES}" == "true" ]]; then
            echo "Dependabot reports maintainer changes; automatic merge is disabled."
          else
            case "${UPDATE_TYPE}" in
              version-update:semver-patch)
                eligible="${ALLOW_PATCH}"
                ;;
              version-update:semver-minor)
                eligible="${ALLOW_MINOR}"
                ;;
              version-update:semver-major)
                eligible="${ALLOW_MAJOR}"
                ;;
              *)
                echo "Unsupported or unknown update type: ${UPDATE_TYPE}"
                ;;
            esac
          fi

          echo "eligible=${eligible}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Dependabot policy"
            echo
            echo "- Dependency: \`${{ steps.metadata.outputs.dependency-names }}\`"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Update type: \`${UPDATE_TYPE}\`"
            echo "- Maintainer changes: \`${MAINTAINER_CHANGES}\`"
            echo "- Eligible: \`${eligible}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Approve eligible pull request
        if: inputs.auto-approve && steps.policy.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "${PR_URL}"

      - name: Enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: gh pr merge --auto "--${MERGE_METHOD}" "${PR_URL}"
