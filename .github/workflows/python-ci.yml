name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the quality job.
        type: string
        required: false
        default: "3.11"
      working-directory:
        description: Directory containing the Python service.
        type: string
        required: false
        default: .
      dependency-file:
        description: Dependency file used for pip caching.
        type: string
        required: false
        default: requirements-dev.txt
      install-command:
        description: Command used to install quality and test dependencies.
        type: string
        required: false
        default: python -m pip install --requirement requirements-dev.txt
      format-command:
        description: Formatting check command. Leave empty to skip.
        type: string
        required: false
        default: ruff format --check .
      lint-command:
        description: Lint command. Leave empty to skip.
        type: string
        required: false
        default: ruff check .
      test-command:
        description: Test command. Leave empty to skip.
        type: string
        required: false
        default: coverage run --source=main -m unittest discover --start-directory test --verbose && coverage xml
      compile-command:
        description: Production source compile command. Leave empty to skip.
        type: string
        required: false
        default: python -m py_compile main.py
      coverage-artifact-name:
        description: Artifact name used to expose test coverage to a later job. Leave empty to skip upload.
        type: string
        required: false
        default: ""
      coverage-path:
        description: Coverage path relative to working-directory.
        type: string
        required: false
        default: coverage.xml
      timeout-minutes:
        description: Maximum duration of the quality job.
        type: number
        required: false
        default: 20
permissions:
  contents: read
jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: format
            command: ${{ inputs.format-command }}
          - check: lint
            command: ${{ inputs.lint-command }}
          - check: test
            command: ${{ inputs.test-command }}
          - check: compile
            command: ${{ inputs.compile-command }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.dependency-file }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: Run ${{ matrix.check }}
        if: matrix.command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ matrix.command }}
      - name: Upload coverage report
        if: matrix.check == 'test' && inputs.coverage-artifact-name != '' && inputs.test-command != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: error
          retention-days: 1
  result:
    name: CI result
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
