name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the quality job.
        type: string
        required: false
        default: "3.11"
      working-directory:
        description: Directory containing the Python service.
        type: string
        required: false
        default: "."
      dependency-file:
        description: Dependency file used for pip caching.
        type: string
        required: false
        default: requirements-dev.txt
      install-command:
        description: Command used to install quality and test dependencies.
        type: string
        required: false
        default: python -m pip install --requirement requirements-dev.txt
      format-command:
        description: Formatting check command. Leave empty to skip.
        type: string
        required: false
        default: ruff format --check .
      lint-command:
        description: Lint command. Leave empty to skip.
        type: string
        required: false
        default: ruff check .
      test-command:
        description: Test command. Leave empty to skip.
        type: string
        required: false
        default: coverage run --source=main -m unittest discover --start-directory test --verbose && coverage xml
      compile-command:
        description: Production source compile command. Leave empty to skip.
        type: string
        required: false
        default: python -m py_compile main.py
      run-sonarqube:
        description: Run the SonarQube scanner after all quality checks pass.
        type: boolean
        required: false
        default: false
      sonar-host-url:
        description: SonarQube server URL. Required when run-sonarqube is true.
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: Maximum duration of the quality job.
        type: number
        required: false
        default: 20
    secrets:
      SONAR_TOKEN:
        description: SonarQube authentication token.
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.dependency-file }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Check formatting
        if: inputs.format-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.format-command }}

      - name: Lint
        if: inputs.lint-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

      - name: Run tests
        if: inputs.test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Compile production source
        if: inputs.compile-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.compile-command }}

      - name: Validate SonarQube configuration
        if: inputs.run-sonarqube
        shell: bash
        env:
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_HOST_URL}" ]]; then
            echo "::error::sonar-host-url is required when run-sonarqube is true."
            exit 1
          fi
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::error::SONAR_TOKEN is required when run-sonarqube is true."
            exit 1
          fi

      - name: Run SonarQube analysis
        if: inputs.run-sonarqube
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
